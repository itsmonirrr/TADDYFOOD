<body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Decorative Abstract Background Elements for 3D/Glass depth -->
<div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary-fixed rounded-full mix-blend-multiply filter blur-[100px] opacity-70 animate-pulse" style="animation-duration: 8s;"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-tertiary-fixed rounded-full mix-blend-multiply filter blur-[100px] opacity-50 animate-pulse" style="animation-duration: 12s;"></div>
<!-- Main Content Container -->
<main class="w-full max-w-md px-gutter relative z-10">
<!-- Glassmorphism Login Card -->
<div class="bg-white/70 backdrop-blur-xl border border-white/60 shadow-[0_10px_40px_rgba(0,0,0,0.06)] rounded-xl p-xl flex flex-col items-center">
<!-- 3D Mascot Logo -->
<div class="w-32 h-32 mb-lg relative -mt-xxl">
<!-- Using a subtle shadow under the image to enhance the 3D pop-out effect -->
<div class="absolute inset-0 bg-black/5 rounded-full blur-md translate-y-4"></div>
<img alt="TEDDYFOOD 3D Mascot" class="w-full h-full object-contain drop-shadow-xl relative z-10 hover:-translate-y-2 transition-transform duration-500 ease-out" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCVvKsSikakj0ix6VcZH71_xQpwUdDqfO8MQ-RTlNNGr5CIxFaBR10eUUG0czE4rwX8UGwIHIx7QJE_IPsX_VOmDkM8LseMHt08F-L-yC9uJ-Rrp1d_dV2fNGcois2_ieMQirpxaEoyG3jJfISJJzRoNkn-G5hOfMyRzek-AlxFMHkkcSk204vQkAnIczWJ73LEDbw15l1odgSD7ccrekgywPaQSjsdmE9AwyxR1bn2Jx0MhjuchI8WR4hJeihkNxTDyMXxWNoo_mI"/>
</div>
<!-- Header -->
<div class="text-center mb-lg w-full">
<h1 class="text-headline-md font-headline-md text-on-surface tracking-tight">Welcome Back! 👋</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-xs">Ready for another delicious delivery?</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="premium-input bg-surface-container-low rounded-full px-lg py-sm flex items-center border border-transparent focus-within:border-primary/30">
<span class="material-symbols-outlined text-secondary mr-sm" style="font-variation-settings: 'FILL' 1;">mail</span>
<input class="w-full bg-transparent border-none text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 px-0" placeholder="Email address" required="" type="email"/>
</div>
<!-- Password Field -->
<div>
<div class="premium-input bg-surface-container-low rounded-full px-lg py-sm flex items-center border border-transparent focus-within:border-primary/30">
<span class="material-symbols-outlined text-secondary mr-sm" style="font-variation-settings: 'FILL' 1;">lock</span>
<input class="w-full bg-transparent border-none text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 px-0" id="passwordInput" placeholder="Password" required="" type="password"/>
<button class="text-secondary hover:text-primary transition-colors focus:outline-none p-xs ml-sm rounded-full" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined" id="togglePasswordIcon">visibility</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-sm">
<a class="text-label-sm font-label-sm text-primary hover:text-primary-container hover:underline transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary text-label-md font-label-md rounded-full py-4 shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/40 hover:-translate-y-1 hover:scale-[1.02] transition-all duration-300 ring-1 ring-inset ring-white/20 relative overflow-hidden group" type="submit">
<span class="relative z-10">Log In</span>
<!-- Subtle shine effect on hover -->
<div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent group-hover:animate-[shimmer_1.5s_infinite] skew-x-12"></div>
</button>
</div>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-lg">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="mx-sm text-label-sm font-label-sm text-on-surface-variant/70 uppercase tracking-wider">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Sign Up Prompt -->
<div class="text-center text-body-md font-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-bold hover:text-primary-container hover:underline transition-colors ml-xs" href="#">Sign up</a>
</div>
</div>
</main>
<script>
        // Password Visibility Toggle Logic
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('passwordInput');
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const toggleIcon = document.getElementById('togglePasswordIcon');

            toggleBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleIcon.textContent = 'visibility_off';
                } else {
                    passwordInput.type = 'password';
                    toggleIcon.textContent = 'visibility';
                }
            });
        });
    </script>
