<script>
        // Simple JS to handle active state of payment methods
        document.querySelectorAll('input[name="payment"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Reset all
                document.querySelectorAll('input[name="payment"]').forEach(r => {
                    const label = r.closest('label');
                    label.classList.remove('border-primary-container', 'bg-primary-fixed/20');
                    label.classList.add('border-transparent', 'hover:border-outline-variant');
                    const icon = label.querySelector('.material-symbols-outlined');
                    icon.classList.remove('text-primary-container');
                    icon.classList.add('text-secondary');
                });
                
                // Set active
                if(this.checked) {
                    const activeLabel = this.closest('label');
                    activeLabel.classList.remove('border-transparent', 'hover:border-outline-variant');
                    activeLabel.classList.add('border-primary-container', 'bg-primary-fixed/20');
                    const activeIcon = activeLabel.querySelector('.material-symbols-outlined');
                    activeIcon.classList.remove('text-secondary');
                    activeIcon.classList.add('text-primary-container');
                }
            });
        });
    </script>
